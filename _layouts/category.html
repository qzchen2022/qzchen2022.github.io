---
layout: default
---

<div class="post-grid">
  {% for post in site.posts %}
    {% if post.categories contains page.category %}
      <div class="post-grid-item">
        <div class="post-card">
          {% include featured-post.html %}
        </div>
      </div>
    {% endif %}
  {% endfor %}
</div>

<style>
.post-grid {
  display: grid;
  gap: 2rem;
  margin: 2rem 0;
  max-width: 1200px;
  margin-left: auto;
  margin-right: auto;
  padding: 0 15px;
}

/* 默认（大屏幕）显示两列 */
@media screen and (min-width: 769px) {
  .post-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  
  /* 奇数项在最后一行居中 */
  .post-grid-item:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    width: 50%;
    justify-self: center;
  }
}

/* 小屏幕显示单列 */
@media screen and (max-width: 768px) {
  .post-grid {
    grid-template-columns: 1fr;
  }
  
  .post-grid-item:last-child:nth-child(odd) {
    width: 100%;
  }
}

.post-grid-item {
  width: 100%;
  position: relative;
}

.post-card {
  position: relative;
  transition: transform 0.3s ease;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.post-card .featured-image {
  position: relative;
  width: 100%;
  height: auto;
  overflow: hidden;
  border-radius: 15px;
}

.post-card .featured-image img {
  width: 100%;
  height: auto;
  object-fit: cover;
  transition: transform 0.3s ease;
  border-radius: 15px;
}

.post-card .post-content {
  padding: 1.5rem;
  background: rgba(0, 0, 0, 0.7);
  color: white;
  backdrop-filter: blur(5px);
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 2;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 50px;
}
</style>
