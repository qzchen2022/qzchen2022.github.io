---
layout: default
---

<div class="post-grid">
  {% for post in site.posts %}
    {% if post.categories contains page.category %}
      <div class="post-grid-item">
        <div class="post-card">
          {% include featured-post.html %}
        </div>
      </div>
    {% endif %}
  {% endfor %}
</div>

<style>
.post-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2rem;
  margin: 2rem 0;
  perspective: 1000px;
}

.post-grid-item {
  width: 100%;
  position: relative;
}

.post-card {
  position: relative;
  transition: transform 0.3s ease;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  transform-style: preserve-3d;
}

.post-card:hover {
  transform: translateY(-5px) rotateX(2deg) rotateY(2deg);
}

.post-card .featured-image {
  position: relative;
  width: 100%;
  height: 250px;
  overflow: hidden;
  border-radius: 15px;
}

.post-card .featured-image img {
  width: 100%;
  height: auto; /* 保持图片比例 */
  object-fit: cover;
  transition: transform 0.3s ease;
  border-radius: 15px;
}

.post-card .post-content {
  padding: 1.5rem;
  background: rgba(0, 0, 0, 0.7);
  color: white;
  backdrop-filter: blur(5px);
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 2;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 50px;
}

.post-card:hover .featured-image img {
  transform: scale(1.05);
}

@media screen and (max-width: 768px) {
  .post-grid {
    grid-template-columns: 1fr;
  }
  
  .post-card {
    transform: none !important;
  }
}

/* 奇数个项目时，最后一个居中 */
.post-grid-item:nth-child(odd):last-child {
  grid-column: span 2;
  justify-self: center;
}
</style>
